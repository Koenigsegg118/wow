# Qwen3.5-4B LoRA smoke train — restricted 6-label semantic classifier
# 当前是 smoke train，不是正式 9-label 主实验
# 排除标签: support, offensive_turn, energy_manage
# null 版本 (restricted_with_null_review) 仅用于审阅型/校准实验

### model
model_name_or_path: Qwen/Qwen3-4B  # 改成你的本地路径

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05

### dataset
dataset_dir: datasets/trainpacks
train_dataset: restricted_nonnull_train.jsonl
eval_dataset: restricted_nonnull_dev.jsonl
template: qwen3
cutoff_len: 2048
preprocessing_num_workers: 4

### output
output_dir: checkpoints/qwen_smoke_restricted
logging_steps: 10
save_steps: 50
eval_steps: 50
save_total_limit: 3
load_best_model_at_end: true

### train
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
num_train_epochs: 5
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
report_to: none
